<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Best Tech & Fashion Deals | Reema Roy</title>

<link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/vendor/aos/aos.css" rel="stylesheet">
<link href="/assets/css/main.css" rel="stylesheet">

<style>

.deals-layout{
display:flex;
gap:40px;
max-width:1400px;
margin:auto;
padding:40px 20px;
}

.sidebar{
width:260px;
background:#1f1f1f;
padding:20px;
border-radius:12px;
}

.sidebar input,
.sidebar select{
width:100%;
padding:8px;
margin-top:6px;
border-radius:6px;
border:1px solid #333;
background:#111;
color:white;
}

.sidebar button{
margin-top:10px;
padding:8px 14px;
border:none;
background:#ff6600;
color:white;
border-radius:6px;
}

.sidebar h3{
margin-bottom:20px;
}

.filter-group{
margin-bottom:20px;
}

.filter-group input,
.filter-group select{
width:100%;
padding:8px;
margin-top:5px;
}

.deals-content{
flex:1;
}

.deals-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
}  

.deal-card{

width:260px;
height:340px;

background:#1b1b1b;
border-radius:12px;

padding:18px;

display:flex;
flex-direction:column;
justify-content:space-between;

transition:0.2s;
}

.deal-card:hover{
transform:translateY(-6px);
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.deal-img{

height:160px;

display:flex;
align-items:center;
justify-content:center;

}

.deal-img img{

max-height:150px;
max-width:100%;
object-fit:contain;

}

.deal-title{

font-size:14px;
font-weight:600;
color:white;

margin-top:8px;

height:40px;
overflow:hidden;

}

.deal-price{

font-size:18px;
font-weight:700;

color:#ff6600;

margin-top:6px;

}

.deal-btn{

background:#ff6600;
color:white;

text-align:center;

padding:8px;
border-radius:6px;

text-decoration:none;

margin-top:10px;

}  
.stats-wrapper{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
}

.stats-item{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.05);
text-align:center;
}

.stats-item img{
height:200px;
object-fit:contain;
width:100%;
}

.price-badge{
background:#595656;
color:white;
padding:5px 10px;
border-radius:5px;
display:inline-block;
margin-top:5px;
}

.view-btn{
background:var(--accent-color);
color:var(--contrast-color);
padding:8px 15px;
border-radius:5px;
text-decoration:none;
display:inline-block;
margin-top:10px;
}

</style>

</head>

<body>

<div id="header-placeholder"></div>

<main class="main">

<section class="section">

<div class="container section-title" data-aos="fade-up">
<h2>Latest Deals</h2>
<p>Discover curated Amazon and Myntra deals recommended by Reema Roy.</p>
</div>

<div class="deals-layout">

<!-- FILTER SIDEBAR -->

<div class="sidebar">

<h3>Filter</h3>

<div class="filter-group">
<label>Search</label>
<input type="text" id="search" placeholder="Search product">
</div>

<div class="filter-group">
<label>Category</label>
<select id="category">
<option value="">All</option>
<option>Electronics</option>
<option>Home Kitchen</option>
<option>Fashion</option>
<option>Beauty</option>
</select>
</div>

<div class="filter-group">
<label>Max Price</label>
<input type="number" id="price">
</div>

<button class="view-btn" onclick="applyFilters()">Apply Filter</button>

</div>


<!-- DEALS GRID -->

<div class="deals-content">

<div class="deals-grid" id="deals"></div>

</div>

</div>

</section>

</main>

<div id="footer-placeholder"></div>


<script>

let allDeals=[];

async function loadDeals(){

let res=await fetch("/data/deals.json");

allDeals=await res.json();

renderDeals(allDeals);

}


function renderDeals(deals){

let html="";

deals.reverse().forEach(d=>{

html+=`

<div class="deal-card">

<div class="deal-img">

<img src="${d.image || '/assets/img/placeholder.webp'}">

</div>

<div class="deal-title">

${d.title || "Product"}

</div>

<div class="deal-price">

${d.price || ""}

</div>

<a href="${d.link}" target="_blank" class="deal-btn">

View Deal

</a>

</div>

`;

});

document.getElementById("deals").innerHTML=html;

}



function applyFilters(){

let search=document.getElementById("search").value.toLowerCase();

let category=document.getElementById("category").value;

let maxPrice=document.getElementById("price").value;

let filtered=allDeals.filter(d=>{

let matchTitle=d.title.toLowerCase().includes(search);

let matchCategory=!category || d.category===category;

let matchPrice=!maxPrice || parseInt((d.price || "0").replace(/[^0-9]/g,''))<=maxPrice;

return matchTitle && matchCategory && matchPrice;

});

renderDeals(filtered);

}


loadDeals();

</script>

<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/aos/aos.js"></script>
<script src="/assets/js/main.js"></script>

</body>

</html>
