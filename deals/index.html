<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Best Tech & Fashion Deals | Reema Roy</title>

<link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/vendor/aos/aos.css" rel="stylesheet">
<link href="/assets/css/main.css" rel="stylesheet">

<style>

.deals-layout{
display:flex;
gap:40px;
max-width:1400px;
margin:auto;
padding:40px 20px;
}

.sidebar{
width:260px;
background:#1f1f1f;
padding:20px;
border-radius:12px;
}

.sidebar input,
.sidebar select{
width:100%;
padding:8px;
margin-top:6px;
border-radius:6px;
border:1px solid #333;
background:#111;
color:white;
}

.sidebar button{
margin-top:10px;
padding:8px 14px;
border:none;
background:#ff6600;
color:white;
border-radius:6px;
}

.sidebar h3{
margin-bottom:20px;
}

.filter-group{
margin-bottom:20px;
}

.filter-group input,
.filter-group select{
width:100%;
padding:8px;
margin-top:5px;
}

.deals-content{
flex:1;
}

.deals-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
}  

.deal-card{

width:260px;
height:340px;

background:#1b1b1b;
border-radius:12px;

padding:18px;

display:flex;
flex-direction:column;
justify-content:space-between;

transition:0.2s;
}

.deal-card:hover{
transform:translateY(-6px);
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.deal-img{
height:160px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
border-radius:8px;
padding:10px;
}

.deal-img img{
width:100%;
height:180px;
object-fit:contain;
image-rendering:auto;

}

.deal-title{

font-size:14px;
font-weight:600;
color:white;

margin-top:8px;

height:40px;
overflow:hidden;

}

.deal-price{

font-size:18px;
font-weight:700;

color:#ff6600;

margin-top:6px;

}

.deal-btn{

background:#ff6600;
color:white;

text-align:center;

padding:8px;
border-radius:6px;

text-decoration:none;

margin-top:10px;

}  
.stats-wrapper{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
}

.stats-item{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.05);
text-align:center;
}

.stats-item img{
height:200px;
object-fit:contain;
width:100%;
}

.price-badge{
background:#595656;
color:white;
padding:5px 10px;
border-radius:5px;
display:inline-block;
margin-top:5px;
}

.view-btn{
background:var(--accent-color);
color:var(--contrast-color);
padding:8px 15px;
border-radius:5px;
text-decoration:none;
display:inline-block;
margin-top:10px;
}

</style>

</head>

<body>

<div id="header-placeholder"></div>

<main class="main">

<section class="section">

<div class="container section-title" data-aos="fade-up">
<h2>Latest Deals</h2>
<p>Discover curated Amazon and Myntra deals recommended by Reema Roy.</p>
</div>

<div class="deals-layout">

<!-- FILTER SIDEBAR -->
<div class="sidebar">

<h3>Filter</h3>

<div class="filter-group">
<label>Search</label>
<input type="text" id="search" placeholder="Search product">
</div>

<div class="filter-group">
<label>Category</label>
<select id="category">
<option value="">All</option>
<option value="Electronics">Electronics</option>
<option value="Home Kitchen">Home Kitchen</option>
<option value="Fashion">Fashion</option>
<option value="Beauty">Beauty</option>
</select>
</div>

<div class="filter-group">
<label>Price Range</label>

<select id="priceRange">

<option value="">All</option>
<option value="0-1000">₹0 - ₹1000</option>
<option value="1000-5000">₹1000 - ₹5000</option>
<option value="5000-10000">₹5000 - ₹10000</option>
<option value="10000-20000">₹10000 - ₹20000</option>
<option value="20000-999999">₹20000+</option>

</select>

</div>

<button onclick="applyFilters()">Apply Filter</button>

</div>

<!-- DEALS GRID -->

<div class="deals-content">

<div class="deals-grid" id="deals"></div>

</div>

</div>

</section>

</main>

<div id="footer-placeholder"></div>


<script>
  let allDeals=[];
  async function loadDeals(){
  let res=await fetch("/data/deals.json");
  allDeals=await res.json();
  renderDeals(allDeals);
}

  function renderDeals(deals){

let html="";

deals.reverse().forEach(d=>{

let priceNumber=parseInt((d.price || "0").replace(/[^0-9]/g,''));

let image=(d.image || "").replace(/_SL\d+_/,"_SL2000_");

html+=`

<div class="deal-card">

<div class="deal-img">

<img src="${image || '/assets/img/no-image.png'}" loading="lazy">

</div>

<div class="deal-title">
${d.title || "Product"}
</div>

<div class="deal-price">
₹${priceNumber.toLocaleString()}
</div>

<a href="${d.link}" target="_blank" class="deal-btn">
View Deal
</a>

</div>

`;

});

document.getElementById("deals").innerHTML=html;

}

  function applyFilters(){
  let search=document.getElementById("search").value.toLowerCase();
  let category=document.getElementById("category").value;
  let priceRange=document.getElementById("priceRange").value;
  let min=0;
  let max=999999;
  if(priceRange){
  let parts=priceRange.split("-");
  min=parseInt(parts[0]);
  max=parseInt(parts[1]);
  }
  let filtered=allDeals.filter(d=>{
  let title=(d.title || "").toLowerCase();
  let price=parseInt((d.price || "0").replace(/[^0-9]/g,''));
  let matchTitle=title.includes(search);
  let matchCategory = !category || 
    (d.category || "").toLowerCase().trim() === category.toLowerCase().trim();
  let matchPrice=price>=min && price<=max;
  return matchTitle && matchCategory && matchPrice;
  });
  renderDeals(filtered);
  }

loadDeals();

</script>

<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/aos/aos.js"></script>
<script src="/assets/js/main.js"></script>

</body>

</html>
