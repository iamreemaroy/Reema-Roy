<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Best Tech & Fashion Deals | Reema Roy</title>

<link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/vendor/aos/aos.css" rel="stylesheet">
<link href="/assets/css/main.css" rel="stylesheet">

<style>

.deals-layout{
display:flex;
gap:30px;
max-width:1400px;
margin:auto;
padding:40px 20px;
}

.sidebar{
width:260px;
background:white;
padding:20px;
border-radius:10px;
height:fit-content;
box-shadow:0 0 10px rgba(0,0,0,0.05);
}

.sidebar h3{
margin-bottom:20px;
}

.filter-group{
margin-bottom:20px;
}

.filter-group input,
.filter-group select{
width:100%;
padding:8px;
margin-top:5px;
}

.deals-content{
flex:1;
}

.stats-wrapper{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
}

.stats-item{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.05);
text-align:center;
}

.stats-item img{
height:200px;
object-fit:contain;
width:100%;
}

.price-badge{
background:#595656;
color:white;
padding:5px 10px;
border-radius:5px;
display:inline-block;
margin-top:5px;
}

.view-btn{
background:var(--accent-color);
color:var(--contrast-color);
padding:8px 15px;
border-radius:5px;
text-decoration:none;
display:inline-block;
margin-top:10px;
}

</style>

</head>

<body>

<div id="header-placeholder"></div>

<main class="main">

<section class="section">

<div class="container section-title" data-aos="fade-up">
<h2>Latest Deals</h2>
<p>Discover curated Amazon and Myntra deals recommended by Reema Roy.</p>
</div>

<div class="deals-layout">

<!-- FILTER SIDEBAR -->

<div class="sidebar">

<h3>Filter</h3>

<div class="filter-group">
<label>Search</label>
<input type="text" id="search" placeholder="Search product">
</div>

<div class="filter-group">
<label>Category</label>
<select id="category">
<option value="">All</option>
<option>Electronics</option>
<option>Home Kitchen</option>
<option>Fashion</option>
<option>Beauty</option>
</select>
</div>

<div class="filter-group">
<label>Max Price</label>
<input type="number" id="price">
</div>

<button class="view-btn" onclick="applyFilters()">Apply Filter</button>

</div>


<!-- DEALS GRID -->

<div class="deals-content">

<div class="stats-wrapper" id="deals"></div>

</div>

</div>

</section>

</main>

<div id="footer-placeholder"></div>


<script>

let allDeals=[];

async function loadDeals(){

let res=await fetch("/data/deals.json");

allDeals=await res.json();

renderDeals(allDeals);

}


function renderDeals(deals){

let html="";

deals.reverse().forEach(d=>{

html+=`

<div class="stats-item" data-aos="zoom-in">

<img src="${d.image}" alt="${d.title}">

<h3>${d.title}</h3>

<div class="price-badge">${d.price || ""}</div>

<br>

<a href="${d.link}" target="_blank" class="view-btn">
View Deal
</a>

</div>

`;

});

document.getElementById("deals").innerHTML=html;

}



function applyFilters(){

let search=document.getElementById("search").value.toLowerCase();

let category=document.getElementById("category").value;

let maxPrice=document.getElementById("price").value;

let filtered=allDeals.filter(d=>{

let matchTitle=d.title.toLowerCase().includes(search);

let matchCategory=!category || d.category===category;

let matchPrice=!maxPrice || parseInt((d.price || "0").replace(/[^0-9]/g,''))<=maxPrice;

return matchTitle && matchCategory && matchPrice;

});

renderDeals(filtered);

}


loadDeals();

</script>

<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/aos/aos.js"></script>
<script src="/assets/js/main.js"></script>

</body>

</html>
