<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Best Tech & Fashion Deals | Reema Roy</title>
    <meta property="og:title" content="Latest Deals on Amazon & Myntra | Reema Roy">
    <meta property="og:description" content="Best curated deals on Amazon & Myntra. Save more daily.">
    <meta property="og:image" content="/assets/img/og-banner.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.reemaroy.com/deals">
    <link rel="canonical" href="https://www.reemaroy.com/deals">
    <link rel="preconnect" href="https://m.media-amazon.com">

	<!-- Favicons -->
	  <link href="/assets/img/favicon.ico" rel="icon">
	  <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

	  
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/vendor/aos/aos.css" rel="stylesheet">
    <link href="/assets/css/main.css" rel="stylesheet">
    <style>
      /* (your same CSS unchanged) */
      .deals-layout {
        display: flex;
        gap: 40px;
        max-width: 1400px;
        margin: auto;
        padding: 40px 20px;
      }

      .sidebar {
        width: 260px;
        background: #1f1f1f;
        padding: 20px;
        border-radius: 12px;
      }

      .sidebar input,
      .sidebar select {
        width: 100%;
        padding: 8px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #111;
        color: white;
      }

      .sidebar button {
        margin-top: 10px;
        padding: 8px 14px;
        border: none;
        background: #ff6600;
        color: white;
        border-radius: 6px;
      }

      .sidebar h3 {
        margin-bottom: 20px;
      }

      .filter-group {
        margin-bottom: 20px;
      }

      .filter-group input,
      .filter-group select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
      }

      .deals-content {
        flex: 1;
      }

      .deals-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 30px;
      }

      .deal-card {
        width: 300px;
        height: 375px;
        background: #1b1b1b;
        border-radius: 12px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: 0.2s;
      }

      .deal-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .deal-img {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
        border-radius: 8px;
        padding: 10px;
      }

      .deal-img img {
        width: 100%;
        height: 180px;
        object-fit: contain;
      }

      .deal-title {
        font-size: 14px;
        font-weight: 600;
        color: white;
        margin-top: 8px;
        height: 40px;
        text-align: center;
      }

      .deal-price {
        font-size: 18px;
        font-weight: 700;
        color: #ff6600;
        margin-top: 6px;
        text-align: center;
      }

      .deal-btn {
        background: #ff6600;
        color: white;
        text-align: center;
        padding: 8px;
        border-radius: 6px;
        text-decoration: none;
        margin-top: 10px;
      }

      /* MOBILE FILTER UI */
      .mobile-filters {
        display: none;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        z-index: 998;
      }

      .bottom-sheet {
        position: fixed;
        bottom: -100%;
        left: 0;
        width: 100%;
        height: 65%;
        background: #1b1b1b;
        transition: 0.3s;
        z-index: 999;
        border-radius: 16px 16px 0 0;
      }

      .bottom-sheet.active {
        bottom: 0;
      }

      .overlay.active {
        display: block;
      }

      .sheet-content {
        padding: 20px;
        color: white;
      }

      .sheet-content input,
      .sheet-content select {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #111;
        color: white;
        border: 1px solid #333;
        border-radius: 6px;
      }

      /* ✅ MOBILE ONLY */
      @media (max-width: 768px) {
        .sidebar {
          display: none;
        }

        .mobile-filters {
          display: flex;
          gap: 10px;
          padding: 10px;
          overflow-x: auto;
          background: #111;
          position: sticky;
          top: 0;
          z-index: 100;
		  justify-content: center;
        }

        .mobile-filters button {
          background: #222;
          color: white;
          border: none;
          padding: 8px 14px;
          border-radius: 20px;
          white-space: nowrap;
        }

        .deals-layout {
          flex-direction: column;
        }

        .deal-card {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>
    <main class="main">
      <section class="section">
        <div class="container section-title" data-aos="fade-up">
          <h1>Latest Deals</h1>
          <p>Find the latest Amazon and Myntra deals curated daily. Discover discounts on electronics, fashion, home essentials, and more. Save money with verified offers and trending products updated regularly.</p>
        </div>
        <!-- MOBILE FILTER BAR -->
        <div class="mobile-filters">
          <button onclick="openFilter('search')">Search</button>
          <button onclick="openFilter('category')">Category</button>
          <button onclick="openFilter('price')">Price</button>
        </div>
        <!-- OVERLAY -->
        <div class="overlay" id="overlay" onclick="closeFilter()"></div>
        <!-- BOTTOM SHEET -->
        <div id="filterSheet" class="bottom-sheet">
          <div class="sheet-content">
            <h3 id="filterTitle">Filter</h3>
            <div id="filterOptions"></div>
            <button onclick="applyMobileFilters()">Apply Filter</button>
          </div>
        </div>
        <div class="deals-layout">
          <!-- FILTER SIDEBAR -->
          <div class="sidebar">
            <h3>Filter</h3>
            <div class="filter-group">
              <label>Search</label>
              <input type="text" id="search" placeholder="Search product">
            </div>
            <div class="filter-group">
              <label>Category</label>
              <select id="category">
                <option value="">All</option>
                <option value="beauty-skincare">Beauty & Skincare</option>
                <option value="daily-essentials">Daily Essentials</option>
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="home-kitchen">Home & Kitchen</option>
                <option value="lifestyle">Lifestyle</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Price Range</label>
              <select id="priceRange">
                <option value="">All</option>
                <option value="0-1000">₹0 - ₹1000</option>
                <option value="1000-5000">₹1000 - ₹5000</option>
                <option value="5000-10000">₹5000 - ₹10000</option>
                <option value="10000-20000">₹10000 - ₹20000</option>
                <option value="20000-999999">₹20000+</option>
              </select>
            </div>
            <button onclick="applyFilters()">Apply Filter</button>
          </div>
          <!-- DEALS GRID -->
          <div class="deals-content">
            <div class="deals-grid" id="deals"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>
    <script>
      let allDeals = [];
      // LOAD DEALS
      async function loadDeals() {
        let res = await fetch("/data/deals.json");
        allDeals = await res.json();
        // ✅ SEO META
        if (allDeals.length > 0) {
          let first = allDeals[0];
          document.title = "Latest Deals on Amazon & Myntra | Reema Roy";
          let metaDesc = document.querySelector("meta[name='description']");
          if (!metaDesc) {
            metaDesc = document.createElement("meta");
            metaDesc.name = "description";
            document.head.appendChild(metaDesc);
          }
          metaDesc.content = first.description || "Best curated deals on Amazon & Myntra. Save more daily.";
        }
        // ✅ ADD SCHEMA (FIXED POSITION)
        addItemListSchema(allDeals);
        syncFiltersUI();
        filterDeals();
      }
      // RENDER DEALS
      function renderDeals(deals) {
        let html = "";
        deals.slice().reverse().forEach(d => {
          let priceNumber = parseInt((d.price || "0").toString().replace(/[^0-9]/g, '')) || 0;
          let image = (d.image || "").replace(/_SL\d+_/, "_SL2000_");
          html += `
    
	
																	<div class="deal-card">
																		<div class="deal-img">
																			<img src="${image || '/assets/img/no-image.png'}" alt="${d.title || 'Product'}" loading="lazy">
																			</div>
																			<div class="deal-title">
        ${d.title || "Product"}
      </div>
																			<div class="deal-price">
        ₹${priceNumber.toLocaleString()}
      </div>
																			<a href="${d.link}" target="_blank" class="deal-btn">
        View Deal
      </a>
																		</div>
    `;
        });
        document.getElementById("deals").innerHTML = html;
      }
      // APPLY FILTERS
      function applyFilters() {
        let search = document.getElementById("search").value;
        let category = document.getElementById("category").value;
        let priceRange = document.getElementById("priceRange").value;
        let params = new URLSearchParams();
        if (search) params.set("search", search);
        if (category) params.set("category", category);
        if (priceRange) params.set("price", priceRange);
        history.replaceState(null, "", "?" + params.toString());
        filterDeals();
      }
      // FILTER LOGIC
      function filterDeals() {
        let urlParams = new URLSearchParams(window.location.search);
        let search = (urlParams.get("search") || "").toLowerCase();
        let category = urlParams.get("category");
        let priceRange = urlParams.get("price");
        let min = 0;
        let max = 999999;
        if (priceRange) {
          let parts = priceRange.split("-");
          min = parseInt(parts[0]);
          max = parseInt(parts[1]);
        }
        let filtered = allDeals.filter(d => {
          let title = (d.title || "").toLowerCase();
          let price = parseInt((d.price || "0").toString());
          let matchTitle = title.includes(search);
          let matchCategory = !category || (d.category || "").toLowerCase().trim() === category.toLowerCase().trim();
          let matchPrice = price >= min && price <= max;
          return matchTitle && matchCategory && matchPrice;
        });
        renderDeals(filtered);
      }
      // SYNC UI
      function syncFiltersUI() {
        let params = new URLSearchParams(window.location.search);
        document.getElementById("search").value = params.get("search") || "";
        document.getElementById("category").value = params.get("category") || "";
        document.getElementById("priceRange").value = params.get("price") || "";
      }
      // ITEM LIST SCHEMA (SEO)
      function addItemListSchema(deals) {
        if (!deals || deals.length === 0) return;
        let items = deals.slice(0, 20).map((d, i) => ({
          "@type": "ListItem",
          "position": i + 1,
          "name": d.title,
          "url": d.link
        }));
        let schema = {
          "@context": "https://schema.org",
          "@type": "ItemList",
          "itemListElement": items
        };
        let old = document.getElementById("itemlist-schema");
        if (old) old.remove();
        let script = document.createElement("script");
        script.type = "application/ld+json";
        script.id = "itemlist-schema";
        script.innerHTML = JSON.stringify(schema);
        document.head.appendChild(script);
      }

      function openFilter(type) {
        document.getElementById("filterSheet").classList.add("active");
        document.getElementById("overlay").classList.add("active");
        let title = document.getElementById("filterTitle");
        let options = document.getElementById("filterOptions");
        if (type === "search") {
          title.innerText = "Search";
          options.innerHTML = `
      
																		<input type="text" id="m_search" placeholder="Search product">
    `;
        }
        if (type === "category") {
          title.innerText = "Category";
          options.innerHTML = `
      
																			<select id="m_category">
																				<option value="">All</option>
																				<option value="beauty-skincare">Beauty & Skincare</option>
																				<option value="daily-essentials">Daily Essentials</option>
																				<option value="electronics">Electronics</option>
																				<option value="fashion">Fashion</option>
																				<option value="home-kitchen">Home & Kitchen</option>
																				<option value="lifestyle">Lifestyle</option>
																			</select>
    `;
        }
        if (type === "price") {
          title.innerText = "Price Range";
          options.innerHTML = `
      
																			<select id="m_price">
																				<option value="">All</option>
																				<option value="0-1000">₹0 - ₹1000</option>
																				<option value="1000-5000">₹1000 - ₹5000</option>
																				<option value="5000-10000">₹5000 - ₹10000</option>
																				<option value="10000-20000">₹10000 - ₹20000</option>
																				<option value="20000-999999">₹20000+</option>
																			</select>
    `;
        }
      }

      function closeFilter() {
        document.getElementById("filterSheet").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
      }

      function applyMobileFilters() {
        let search = document.getElementById("m_search")?.value || "";
        let category = document.getElementById("m_category")?.value || "";
        let price = document.getElementById("m_price")?.value || "";
        let params = new URLSearchParams(window.location.search);
        if (search) params.set("search", search);
        if (category) params.set("category", category);
        if (price) params.set("price", price);
        history.replaceState(null, "", "?" + params.toString());
        closeFilter();
        filterDeals();
      }
      // INIT
      loadDeals();
    </script>
    <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/vendor/aos/aos.js"></script>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
