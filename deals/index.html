<!DOCTYPE html>
<html>

<head>

<title>Latest Deals | Reema Roy</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

.container{
display:flex;
max-width:1400px;
margin:auto;
padding:20px;
}

/* FILTER SIDEBAR */

.sidebar{
width:260px;
background:white;
padding:20px;
border-radius:10px;
height:fit-content;
}

.sidebar h3{
margin-top:0;
}

.filter-group{
margin-bottom:20px;
}

.filter-group input{
width:100%;
padding:8px;
margin-top:5px;
}

/* DEAL GRID */

.content{
flex:1;
padding-left:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
border:1px solid #eee;
}

.card img{
width:100%;
height:200px;
object-fit:contain;
}

.card h3{
font-size:16px;
height:50px;
overflow:hidden;
}

.price{
font-weight:bold;
font-size:18px;
margin-top:10px;
}

.btn{
display:block;
margin-top:10px;
background:black;
color:white;
text-align:center;
padding:10px;
border-radius:6px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<!-- FILTER SIDEBAR -->

<div class="sidebar">

<h3>Filter</h3>

<div class="filter-group">

<label>Search</label>
<input type="text" id="search" placeholder="Search product">

</div>

<div class="filter-group">

<label>Category</label>

<select id="category">

<option value="">All</option>
<option>Electronics</option>
<option>Home Kitchen</option>
<option>Fashion</option>
<option>Beauty</option>

</select>

</div>

<div class="filter-group">

<label>Max Price</label>
<input type="number" id="price">

</div>

<button onclick="applyFilters()">Apply</button>

</div>


<!-- PRODUCT GRID -->

<div class="content">

<h1>Latest Deals</h1>

<div class="grid" id="deals"></div>

</div>

</div>

<script>

let allDeals=[];

async function loadDeals(){

let res=await fetch("/data/deals.json");

allDeals=await res.json();

renderDeals(allDeals);

}

function renderDeals(deals){

let html="";

deals.forEach(d=>{

html+=`

<div class="card">

<img src="${d.image}">

<h3>${d.title}</h3>

<div class="price">${d.price || ""}</div>

<a class="btn" href="${d.link}" target="_blank">
View Deal
</a>

</div>

`;

});

document.getElementById("deals").innerHTML=html;

}

function applyFilters(){

let search=document.getElementById("search").value.toLowerCase();

let category=document.getElementById("category").value;

let maxPrice=document.getElementById("price").value;

let filtered=allDeals.filter(d=>{

let matchTitle=d.title.toLowerCase().includes(search);

let matchCategory=!category || d.category===category;

let matchPrice=!maxPrice || parseInt(d.price.replace(/[^0-9]/g,''))<=maxPrice;

return matchTitle && matchCategory && matchPrice;

});

renderDeals(filtered);

}

loadDeals();

</script>

</body>

</html>
