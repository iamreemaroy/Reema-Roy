    <script>
let allDeals = [];

/* ================= LOAD ================= */
async function loadDeals() {
  let res = await fetch("/data/deals.json");
  allDeals = await res.json();

  if (allDeals.length > 0) {
    let first = allDeals[0];
    document.title = "Latest Deals on Amazon & Myntra | Reema Roy";

    let metaDesc = document.querySelector("meta[name='description']");
    if (!metaDesc) {
      metaDesc = document.createElement("meta");
      metaDesc.name = "description";
      document.head.appendChild(metaDesc);
    }

    metaDesc.content = first.description || "Best curated deals on Amazon & Myntra.";
  }

  addItemListSchema(allDeals);
  syncFiltersUI();
  renderActiveFilters();
  filterDeals();
}

/* ================= RENDER ================= */
function renderDeals(deals) {
  let html = "";

  deals.slice().reverse().forEach(d => {
    let priceNumber = parseInt((d.price || "0").toString().replace(/[^0-9]/g, '')) || 0;
    let image = (d.image || "").replace(/_SL\d+_/, "_SL2000_");

    html += `
      <div class="deal-card">
        <div class="deal-img">
          <img src="${image || '/assets/img/no-image.png'}" loading="lazy">
        </div>
        <div class="deal-title">${d.title || "Product"}</div>
        <div class="deal-price">₹${priceNumber.toLocaleString()}</div>
        <a href="${d.link}" target="_blank" class="deal-btn">View Deal</a>
      </div>
    `;
  });

  document.getElementById("deals").innerHTML = html;
}

/* ================= URL ================= */
function getParams() {
  return new URLSearchParams(window.location.search);
}

function updateURL(params) {
  history.replaceState(null, "", "?" + params.toString());
}

/* ================= FILTER ================= */
function filterDeals() {
  let params = getParams();

  let search = (params.get("search") || "").toLowerCase();
  let categories = (params.get("category") || "").split(",");
  let priceRange = params.get("price");
  let sort = params.get("sort");

  let min = 0, max = 999999;

  if (priceRange) {
    let p = priceRange.split("-");
    min = +p[0];
    max = +p[1];
  }

  let filtered = allDeals.filter(d => {
    let title = (d.title || "").toLowerCase();
    let price = parseInt(d.price || "0");

    let matchSearch = title.includes(search);
    let matchCategory = !categories[0] || categories.includes((d.category || "").toLowerCase());
    let matchPrice = price >= min && price <= max;
  });

  if (sort === "low") filtered.sort((a,b)=>a.price-b.price);
  if (sort === "high") filtered.sort((a,b)=>b.price-a.price);

  renderDeals(filtered);
}

/* ================= FILTER ACTIONS ================= */
function instantFilter(type, value) {
  let params = getParams();

  if (!value) params.delete(type);
  else params.set(type, value);

  updateURL(params);
  renderActiveFilters();
  filterDeals();
}

function multiSelectFilter(type, checkbox) {
  let params = getParams();
  let values = (params.get(type) || "").split(",").filter(Boolean);

  if (checkbox.checked) values.push(checkbox.value);
  else values = values.filter(v => v !== checkbox.value);

  if (values.length) params.set(type, values.join(","));
  else params.delete(type);

  updateURL(params);
  renderActiveFilters();
  filterDeals();
}

function removeFilter(type) {
  let params = getParams();
  params.delete(type);
  updateURL(params);
  renderActiveFilters();
  filterDeals();
}

function clearAllFilters() {
  history.replaceState(null, "", window.location.pathname);
  renderActiveFilters();
  filterDeals();
}

/* ================= UI ================= */
function renderActiveFilters() {
  let params = getParams();
  let container = document.getElementById("activeFilters");

  let chips = [];

  params.forEach((val, key) => {
    chips.push(`
      <div class="filter-chip">
        ${key}: ${val}
        <span onclick="removeFilter('${key}')">✕</span>
      </div>
    `);
  });

  if (chips.length) {
    chips.push(`<div class="clear-all" onclick="clearAllFilters()">Clear All</div>`);
  }

  container.innerHTML = chips.join("");
}

/* ================= FILTER UI ================= */
function openFilter(type) {
  document.getElementById("filterSheet").classList.add("active");
  document.getElementById("overlay").classList.add("active");

  let params = getParams();
  let options = document.getElementById("filterOptions");

  /* SEARCH */
  if (type === "search") {
    options.innerHTML = `
      <input type="text"
      value="${params.get("search") || ""}"
      placeholder="Search..."
      oninput="instantFilter('search', this.value)">
    `;
  }

  /* CATEGORY (MULTI SELECT) */
  if (type === "category") {
    let selected = (params.get("category") || "").split(",");
    let list = ["beauty-skincare","fashion","electronics","home-kitchen","lifestyle"];

    options.innerHTML = list.map(c => `
      <label style="display:flex; gap:10px; padding:10px 0;">
        <input type="checkbox" value="${c}"
        ${selected.includes(c) ? "checked" : ""}
        onchange="multiSelectFilter('category', this)">
        ${c}
      </label>
    `).join("");
  }

  /* PRICE (CLICK SELECT - NO DROPDOWN) */
  if (type === "price") {
    let selected = params.get("price") || "";

    let list = [
      {label:"All", value:""},
      {label:"₹0 - ₹1000", value:"0-1000"},
      {label:"₹1000 - ₹5000", value:"1000-5000"},
      {label:"₹5000 - ₹10000", value:"5000-10000"}
    ];

    options.innerHTML = list.map(p => `
      <div onclick="instantFilter('price','${p.value}')"
        style="
          padding:12px;
          margin-bottom:8px;
          border-radius:8px;
          background:${selected === p.value ? '#ff6600' : '#222'};
          cursor:pointer;
        ">
        ${p.label}
      </div>
    `).join("");
  }

  /* SORT (CLICK SELECT - NO DROPDOWN) */
  if (type === "sort") {
    let selected = params.get("sort") || "";

    let list = [
      {label:"Default", value:""},
      {label:"Price Low → High", value:"low"},
      {label:"Price High → Low", value:"high"}
    ];

    options.innerHTML = list.map(s => `
      <div onclick="instantFilter('sort','${s.value}')"
        style="
          padding:12px;
          margin-bottom:8px;
          border-radius:8px;
          background:${selected === s.value ? '#ff6600' : '#222'};
          cursor:pointer;
        ">
        ${s.label}
      </div>
    `).join("");
  }
}

function closeFilter() {
  document.getElementById("filterSheet").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

/* ================= SYNC ================= */
function syncFiltersUI() {
  let params = getParams();

  let s = document.getElementById("search");
  let c = document.getElementById("category");
  let p = document.getElementById("priceRange");

  if (s) s.value = params.get("search") || "";
  if (c) c.value = params.get("category") || "";
  if (p) p.value = params.get("price") || "";
}

/* ================= SCHEMA ================= */
function addItemListSchema(deals) {
  if (!deals.length) return;

  let items = deals.slice(0, 20).map((d, i) => ({
    "@type": "ListItem",
    "position": i + 1,
    "name": d.title,
    "url": d.link
  }));

  let schema = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": items
  };

  let script = document.createElement("script");
  script.type = "application/ld+json";
  script.innerHTML = JSON.stringify(schema);

  document.head.appendChild(script);
}

/* ================= INIT ================= */
loadDeals();
</script>
