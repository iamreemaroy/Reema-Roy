<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Best Tech & Fashion Deals | Reema Roy</title>

<link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/vendor/aos/aos.css" rel="stylesheet">
<link href="/assets/css/main.css" rel="stylesheet">

<style>
/* (your same CSS unchanged) */
.deals-layout{
display:flex;
gap:40px;
max-width:1400px;
margin:auto;
padding:40px 20px;
}

.sidebar{
width:260px;
background:#1f1f1f;
padding:20px;
border-radius:12px;
}

.sidebar input,
.sidebar select{
width:100%;
padding:8px;
margin-top:6px;
border-radius:6px;
border:1px solid #333;
background:#111;
color:white;
}

.sidebar button{
margin-top:10px;
padding:8px 14px;
border:none;
background:#ff6600;
color:white;
border-radius:6px;
}

.sidebar h3{
margin-bottom:20px;
}

.filter-group{
margin-bottom:20px;
}

.filter-group input,
.filter-group select{
width:100%;
padding:8px;
margin-top:5px;
}

.deals-content{
flex:1;
}

.deals-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:30px;
}  

.deal-card{
width:260px;
height:340px;
background:#1b1b1b;
border-radius:12px;
padding:18px;
display:flex;
flex-direction:column;
justify-content:space-between;
transition:0.2s;
}

.deal-card:hover{
transform:translateY(-6px);
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.deal-img{
display:flex;
align-items:center;
justify-content:center;
background:#111;
border-radius:8px;
padding:10px;
}

.deal-img img{
width:100%;
height:180px;
object-fit:contain;
}

.deal-title{
font-size:14px;
font-weight:600;
color:white;
margin-top:8px;
height:40px;
text-align:center;
}

.deal-price{
font-size:18px;
font-weight:700;
color:#ff6600;
margin-top:6px;
text-align:center;
}

.deal-btn{
background:#ff6600;
color:white;
text-align:center;
padding:8px;
border-radius:6px;
text-decoration:none;
margin-top:10px;
}
</style>

</head>

<body>

<div id="header-placeholder"></div>

<main class="main">

<section class="section">

<div class="container section-title" data-aos="fade-up">
<h2>Latest Deals</h2>
<p>Discover curated Amazon and Myntra deals recommended by Reema Roy.</p>
</div>

<div class="deals-layout">

<!-- FILTER SIDEBAR -->
<div class="sidebar">

<h3>Filter</h3>

<div class="filter-group">
<label>Search</label>
<input type="text" id="search" placeholder="Search product">
</div>

<div class="filter-group">
<label>Category</label>
<select id="category">
<option value="">All</option>
<option value="beauty-skincare">Beauty & Skincare</option>
<option value="daily-essentials">Daily Essentials</option>
<option value="electronics">Electronics</option>
<option value="fashion">Fashion</option>
<option value="home-kitchen">Home & Kitchen</option>
<option value="lifestyle">Lifestyle</option>
</select>
</div>

<div class="filter-group">
<label>Price Range</label>
<select id="priceRange">
<option value="">All</option>
<option value="0-1000">₹0 - ₹1000</option>
<option value="1000-5000">₹1000 - ₹5000</option>
<option value="5000-10000">₹5000 - ₹10000</option>
<option value="10000-20000">₹10000 - ₹20000</option>
<option value="20000-999999">₹20000+</option>
</select>
</div>

<button onclick="applyFilters()">Apply Filter</button>

</div>

<!-- DEALS GRID -->
<div class="deals-content">
<div class="deals-grid" id="deals"></div>
</div>

</div>

</section>

</main>

<div id="footer-placeholder"></div>

<script>

let allDeals=[];

// LOAD DEALS
async function loadDeals(){

let res=await fetch("/data/deals.json");
allDeals=await res.json();

// ✅ SEO META (FIXED)
if(allDeals.length > 0){
  let first = allDeals[0];

  document.title = "Latest Deals on Amazon & Myntra | Reema Roy";

  let metaDesc = document.querySelector("meta[name='description']");
  if (!metaDesc) {
    metaDesc = document.createElement("meta");
    metaDesc.name = "description";
    document.head.appendChild(metaDesc);
  }

  metaDesc.content = first.description || "Best curated deals on Amazon & Myntra. Save more daily.";
}

syncFiltersUI();
filterDeals();
}


// RENDER DEALS
function renderDeals(deals){

let html="";

deals.slice().reverse().forEach(d=>{

let priceNumber=parseInt((d.price || "0").toString().replace(/[^0-9]/g,'')) || 0;
let image=(d.image || "").replace(/_SL\d+_/,"_SL2000_");

html+=`
<div class="deal-card">

<div class="deal-img">
<img src="${image || '/assets/img/no-image.png'}" loading="lazy">
</div>

<div class="deal-title">
${d.title || "Product"}
</div>

<div class="deal-price">
₹${priceNumber.toLocaleString()}
</div>

<a href="${d.link}" target="_blank" class="deal-btn">
View Deal
</a>

</div>
`;

});

document.getElementById("deals").innerHTML=html;

}


// APPLY FILTERS
function applyFilters(){

let search=document.getElementById("search").value;
let category=document.getElementById("category").value;
let priceRange=document.getElementById("priceRange").value;

let params=new URLSearchParams();

if(search) params.set("search",search);
if(category) params.set("category",category);
if(priceRange) params.set("price",priceRange);

history.replaceState(null,"","?"+params.toString());

filterDeals();
}


// FILTER LOGIC
function filterDeals(){

let urlParams=new URLSearchParams(window.location.search);

let search=(urlParams.get("search") || "").toLowerCase();
let category=urlParams.get("category");
let priceRange=urlParams.get("price");

let min=0;
let max=999999;

if(priceRange){
let parts=priceRange.split("-");
min=parseInt(parts[0]);
max=parseInt(parts[1]);
}

let filtered=allDeals.filter(d=>{

let title=(d.title || "").toLowerCase();
let price=parseInt((d.price || "0").toString());

let matchTitle=title.includes(search);

let matchCategory=!category || 
(d.category || "").toLowerCase().trim() === category.toLowerCase().trim();

let matchPrice=price>=min && price<=max;

return matchTitle && matchCategory && matchPrice;

});

renderDeals(filtered);
}


// SYNC UI
function syncFiltersUI(){

let params=new URLSearchParams(window.location.search);

document.getElementById("search").value=params.get("search") || "";
document.getElementById("category").value=params.get("category") || "";
document.getElementById("priceRange").value=params.get("price") || "";

}


// Item Schema
function addItemListSchema(deals){
let items = deals.slice(0, 20).map((d, i) => ({
  "@type": "ListItem",
  "position": i + 1,
  "name": d.title,
  "url": d.link
}));
let schema = {
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": items
};
let old = document.getElementById("itemlist-schema");
if(old) old.remove();
let script = document.createElement("script");
script.type = "application/ld+json";
script.id = "itemlist-schema";
script.innerHTML = JSON.stringify(schema);
document.head.appendChild(script);
}

// INIT
loadDeals();
addItemListSchema(allDeals); 
  
</script>

<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/aos/aos.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
