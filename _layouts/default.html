<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | Reema Roy
    {% else %}
      Reema Roy | Blog on Technology, AI, Learning & Development
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: 'Read articles by Reema Roy about AI, technology, learning platforms, software development and career growth.' }}">
  <meta name="author" content="Reema Roy">
  <meta name="robots" content="index, follow">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph (Facebook, LinkedIn) -->
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="Reema Roy Blog">
  <meta property="og:image" content="{{ page.thumbnail | default: page.image | default: '/assets/img/profile/profile-2.webp' | absolute_url }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">


  <!-- Favicons -->
  <link href="{{ 'assets/img/favicon.ico' | relative_url }}" rel="icon">
  <link href="{{ 'assets/img/apple-touch-icon.png' | relative_url }}" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Ubuntu:wght@400;500;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS -->
  <link href="{{ 'assets/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ 'assets/vendor/bootstrap-icons/bootstrap-icons.css' | relative_url }}" rel="stylesheet">
  <link href="{{ 'assets/vendor/aos/aos.css' | relative_url }}" rel="stylesheet">
  <link href="{{ 'assets/vendor/glightbox/css/glightbox.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ 'assets/vendor/swiper/swiper-bundle.min.css' | relative_url }}" rel="stylesheet">

  <!-- Main CSS -->
  <link href="{{ 'assets/css/main.css' | relative_url }}" rel="stylesheet">
  
  <!-- Google Analytics -->
  <script src="{{ 'assets/js/tracking.js' | relative_url }}"></script>

  <script type="application/ld+json">
    {
     "@context": "https://schema.org",
     "@type": "BlogPosting",
     "headline": "{{ page.title }}",
     "description": "{{ page.description }}",
     "author": {
       "@type": "Person",
       "name": "Reema Roy"
     },
     "publisher": {
       "@type": "Organization",
       "name": "Reema Roy",
       "logo": {
         "@type": "ImageObject",
         "url": "{{ '/assets/img/profile/profile-2.webp' | absolute_url }}"
       }
     },
       "datePublished": "{{ page.date | date_to_xmlschema }}",
        "mainEntityOfPage": {
           "@type": "WebPage",
           "@id": "{{ page.url | absolute_url }}"
     }
    }
  </script>

   <!-- ✅ AUTO LAZY LOAD ALL IMAGES -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.querySelectorAll("img").forEach(function(img) {
        if (!img.hasAttribute("loading")) {
          img.setAttribute("loading","lazy");
        }
      });
    });
  </script>
  
</head>

<body>

  <div id="header-placeholder"></div>

  {{ content }}

  {% include footer.html %}

  <a href="#" class="scroll-top d-flex align-items-center justify-content-center"> <i class="bi bi-arrow-up-short"></i> </a>

  <!-- Vendor JS -->
  <script src="{{ 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' | relative_url }}"></script>
  <script src="{{ 'assets/vendor/aos/aos.js' | relative_url }}"></script>
  <script src="{{ 'assets/vendor/glightbox/js/glightbox.min.js' | relative_url }}"></script>
  <script src="{{ 'assets/vendor/swiper/swiper-bundle.min.js' | relative_url }}"></script>

  <!-- Main JS -->
  <script src="{{ 'assets/js/main.js' | relative_url }}"></script>

</body>
</html>


<style>
main.main.blog-details-page {
      padding-left: 250px;
}
  </style>
