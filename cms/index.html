<!DOCTYPE html>
  <html>
    <head>
      <meta charset="utf-8">
      <title>ReemaRoy CMS</title>
      <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
      body{
      font-family:Arial;
      background:#f5f5f5;
      margin:0;
    }
    
    .cms-container{
      max-width:900px;
      margin:40px auto;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }
    
    h1{
      margin-bottom:20px;
    }
    
    label{
      font-weight:600;
      display:block;
      margin-top:15px;
    }
    
    input, textarea, select{
      width:100%;
      padding:10px;
      margin-top:5px;
      border-radius:6px;
      border:1px solid #ccc;
    }
    
    button{
      padding:10px 20px;
      margin-top:15px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
    
    .primary-btn{
      background:#ff6600;
      color:white;
    }
    
    .secondary-btn{
      background:#ddd;
    }
    
    #preview{
      border:1px solid #eee;
      padding:20px;
      margin-top:20px;
      border-radius:8px;
    }
  </style> 
      
</head>

    <body>
      <div class="cms-container">

      <h1>Deals CMS</h1>
      <div style="margin-bottom:20px;">
        <button onclick="loginGithub()" style="background:black;color:white;">
          Login with GitHub
        </button>
      
        <button onclick="logoutGithub()" style="margin-left:10px;">
          Logout
        </button>
      </div>
      
      <label>Affiliate Link</label>
      <input id="link" placeholder="Paste Amazon / Myntra link here">
      
      <button onclick="fetchProduct()">Auto Fetch Product</button>
      
      <br><br>
      
      <label>Title</label>
      <input id="title">
      
      <label>Price</label>
      <input id="price">
      
      <label>Platform</label>
      <input id="platform">
      
      <label>Category</label>
      <select id="category">
        <option value="beauty-skincare">Beauty & Skincare</option>
        <option value="daily-essentials">Daily Essentials</option>
        <option value="electronics">Electronics</option>
        <option value="fashion">Fashion</option>
        <option value="home-kitchen">Home & Kitchen</option>
        <option value="lifestyle">Lifestyle</option>
      </select>
      
      <label>Description</label>
      <textarea id="description"></textarea>
      
      <label>Image URL</label>
      <input id="image">
      
      <br>
      
      
      <div style="margin-top:20px;">
        <button onclick="preview()" class="secondary-btn">Preview</button>
        <<button onclick="publish()" class="primary-btn">Publish</button>
    </div>
      
      <div id="preview"></div>
      
      <script src="github.js"></script>
      <script src="cms.js"></script>

        </div>
  </body>
</html>
