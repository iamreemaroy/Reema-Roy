<div id="deals"></div>

<script>

async function loadDeals(){

let res = await fetch("/data/deals.json");
let deals = await res.json();

let html="";

deals.forEach(d=>{

html+=`
<div class="deal-card">

<img src="${d.image}">

<h3>${d.title}</h3>

<p>${d.price}</p>

<p>${d.platform}</p>

<a href="${d.link}" target="_blank">View Product →</a>

</div>
`;

});

document.getElementById("deals").innerHTML = html;

}

loadDeals();

</script>
